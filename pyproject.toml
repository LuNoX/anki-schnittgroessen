[project]
name = "tm-anki"
version = "0.1.0"
description = "Generiert Anki-Karten zum Üben von Schnittgrößenverläufen (Technische Mechanik)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "LuNoX", email = "maillunox@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "sympy>=1.14.0",
]

[project.scripts]
tm-anki = "tm_anki.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anastruct>=1.7.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pylint>=4.1.4",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# ---- Linting ---------------------------------------------------------------------------------------
# uv run ruff format && uv run ruff check && uv run ty check && uv run mypy && uv run pylint src tests

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["src/tm_anki/katalog/*"]  # Katalog bleibt von Hand formatiert: ein System, eine (logische) Zeile

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PIE", "PERF", "PL"]
ignore = [
    "E741",     # Mechanik-Bezeichner wie l (Länge) sind gewollt
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # Komplexität/Magic Values: Geometrie-Code
    "PLC0415",  # Lazy Imports sind gewollt (schneller CLI-Start, Prozesspool)
    "PLW2901",  # Schleifenvariable überschreiben
    "PLR0917",  # viele Positionsargumente (Zeichenfunktionen)
    "B023",     # Closures in Schleifen werden nur innerhalb derselben Iteration aufgerufen
    "B905",     # zip() ohne strict: Längen sind konstruktionsbedingt gleich
    "PERF401",  # Listen-Append in Schleifen ist hier oft lesbarer
    "RUF001", "RUF002", "RUF003",  # Unicode in Texten (×, −, ′) ist gewollt
]

[tool.ruff.lint.isort]
known-first-party = ["tm_anki", "anastruct_bridge"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = ["tests"]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["genanki", "genanki.*", "anastruct", "anastruct.*", "sympy", "sympy.*"]  # ohne Typinformationen
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pylint.main]
py-version = "3.13"
init-hook = "import sys; sys.path.append('tests')"
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring", "missing-class-docstring", "missing-function-docstring",
    "invalid-name",            # Mechanik-Notation: L, H, S, u, qa, M0 …
    "too-many-locals", "too-many-arguments", "too-many-positional-arguments", "too-many-branches",
    "too-many-statements", "too-many-instance-attributes", "too-many-return-statements",
    "too-few-public-methods",
    "import-outside-toplevel", # Lazy Imports sind gewollt
    "line-too-long",           # erledigt ruff format
    "duplicate-code",
    "cell-var-from-loop",      # wie ruff B023: Closures laufen nur innerhalb der Iteration
    "too-many-boolean-expressions",
]

[tool.pylint.variables]
allowed-redefined-builtins = ["id"]  # Katalog-API: balken("EF01", ...) mit Parameter id
