[project]
name = "tm-anki"
version = "0.1.0"
description = "Generiert Anki-Karten zum Üben von Schnittgrößenverläufen (Technische Mechanik)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "LuNoX", email = "maillunox@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "sympy>=1.14.0",
]

[project.scripts]
tm-anki = "tm_anki.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anastruct>=1.7.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
